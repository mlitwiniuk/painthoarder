production:
  refresh_sitemap:
    class: RefreshSitemapJob
    queue: default
    schedule: every day at 3am
  refresh_paint_catalogs:
    class: RefreshPaintCatalogsJob
    queue: default
    schedule: every day at 5am
  beskar_cleanup_security_state:
    command: "Beskar::SecurityState.cleanup_expired!"
    queue: default
    schedule: every day at 4am
