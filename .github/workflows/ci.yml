name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec bundler-audit check --update
      - run: bin/brakeman --no-pager -w2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn npm audit --all --recursive --no-deprecations

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      HOST: localhost
      PARALLEL_WORKERS: 1
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips sqlite3
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build && yarn build:css
      - run: bin/rails zeitwerk:check
      - name: Run Ruby and browser tests
        env:
          SKIP_JS_BUILD: "1"
          SKIP_CSS_BUILD: "1"
        run: bin/rails db:test:prepare test test:system
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --platform linux/amd64 --tag painthoarder:ci .
